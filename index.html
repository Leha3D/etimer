<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071526">
<title>EugestaTimer</title>
<style>
:root{
  --bg:#061321;--bg2:#0a1c2f;--card:#0c2035;--card2:#102941;
  --line:#183b5d;--text:#f4f8ff;--muted:#91a9c3;--blue:#1598ff;
  --blue2:#0b74d1;--green:#17c45b;--red:#f12d31;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:radial-gradient(circle at 50% -15%,#143b61 0,#08192b 35%,#061321 72%);
color:var(--text);min-height:100vh}
button,input,select{font:inherit}
.app{max-width:1040px;margin:0 auto;padding:28px 20px 55px}
.top{position:relative;text-align:center;padding:4px 0 28px}
.logo{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 7px}
.brand{font-size:46px;font-weight:800;letter-spacing:-1.8px;line-height:1}
.brand span{color:#1598ff}
.subtitle{margin-top:10px;color:#8fa9c5;letter-spacing:5px;font-size:13px;font-weight:600}
.icon-btn{position:absolute;top:4px;width:56px;height:56px;border:1px solid #1b3b5b;border-radius:18px;background:#0c2035;color:#a9c8e7;font-size:27px;box-shadow:0 10px 30px #0005}
.menu{left:0}.theme{right:0}

.menu-panel{display:none;position:absolute;top:72px;left:0;z-index:50;width:220px;background:#0c2035;border:1px solid #244d72;border-radius:16px;padding:10px;box-shadow:0 18px 45px #0008;text-align:left}
.menu-panel.show{display:block}
.menu-title{font-size:13px;color:#8fa9c5;letter-spacing:1.5px;padding:8px 10px 6px;text-transform:uppercase}
.lang-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.lang-btn{border:1px solid #315b83;background:#10283f;color:#cfe2f5;border-radius:10px;padding:9px 6px;cursor:pointer;font-weight:750}
.lang-btn.active{background:#1598ff;color:#fff;border-color:#1598ff}
.card{background:linear-gradient(145deg,#0d2238,#091b2d);border:1px solid #173a5b;border-radius:24px;box-shadow:0 18px 45px #0005;margin-bottom:20px}
.controls{padding:30px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:26px 32px}
.field label{display:block;font-size:22px;font-weight:700;margin-bottom:10px}
.field select,.field input,.time-box{width:100%;height:62px;border-radius:15px;border:1px solid #315b83;background:#091b2d;color:#dbeaff;padding:0 20px;outline:none}
.field select:focus,.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1598ff22}
.time-box{display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:750;font-variant-numeric:tabular-nums}
.date-wrap{position:relative;width:100%;min-width:0;overflow:hidden;border-radius:15px}.date-wrap input[type="date"]{min-width:0;max-width:100%;width:100%;padding-right:52px;-webkit-appearance:none;appearance:none}.date-wrap span{position:absolute;right:19px;top:16px;font-size:25px;color:#9ec6ed;pointer-events:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:26px}
button.action{height:78px;border:0;border-radius:18px;color:white;font-size:27px;font-weight:750;cursor:pointer;box-shadow:0 12px 25px #0004}
.start{background:linear-gradient(135deg,#18cf61,#0aad4b)}.finish{background:linear-gradient(135deg,#ff4145,#d82026)}
.action:disabled{opacity:.38;cursor:not-allowed;filter:grayscale(.2)}
.pause{display:block;margin:13px auto 0;border:1px solid #294b6b;background:#132b43;color:#bfd5eb;border-radius:12px;padding:9px 18px;cursor:pointer}
.pause:disabled{opacity:.35}
.info{margin-top:20px;background:#0b2943;border-radius:16px;padding:16px 20px;color:#a9c8e7;font-size:17px;text-align:center}
.sync{min-height:23px;text-align:center;margin-top:12px;font-size:15px}.ok{color:#4be58a}.err{color:#ff7777}
.status-line{display:flex;align-items:center;justify-content:center;gap:8px;color:#91a9c3;font-size:17px;margin-top:20px}
.live-dot{width:9px;height:9px;border-radius:50%;background:#60788f;display:inline-block}.live-dot.on{background:#19d768;box-shadow:0 0 12px #19d768}
.timer-display{font-size:74px;font-weight:800;text-align:center;letter-spacing:2px;font-variant-numeric:tabular-nums;margin:7px 0 3px}
.section{padding:25px 28px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}
.section-title{font-size:27px;font-weight:780;margin:0}
.open-sheet{color:#69b9ff;text-decoration:none;border:1px solid #18528a;background:#0c2a47;padding:11px 17px;border-radius:12px;font-weight:650}
.history-head,.history-row{display:grid;grid-template-columns:1.3fr 1.1fr .65fr;gap:15px;align-items:center}
.history-head{background:#112b45;color:#a7c3df;padding:14px 18px;border-radius:13px 13px 0 0}
.history-row{padding:15px 18px;border-bottom:1px solid #173650;background:#0a1d30}
.history-row:last-child{border-radius:0 0 13px 13px;border-bottom:0}
.history-title{font-weight:700;font-size:17px}.history-sub,.history-date{color:#91a9c3;font-size:14px;margin-top:4px}
.history-date{text-align:center;line-height:1.45}.history-duration{text-align:right;font-weight:750;font-variant-numeric:tabular-nums}
.empty{padding:25px;color:#819bb5;text-align:center}
.total-card{padding:22px 28px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.total-main{display:flex;align-items:center;gap:17px}.total-icon{font-size:39px;color:#1598ff}
.total-label{font-size:26px;font-weight:760}.total-value{font-size:43px;font-weight:850;color:#1598ff;text-align:right;font-variant-numeric:tabular-nums}
.worker-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px}
.worker-total{background:#0b1f33;border:1px solid #173b5b;border-radius:13px;padding:12px}
.worker-total span{display:block;color:#9ab3cc;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.worker-total strong{display:block;margin-top:5px;font-size:17px;font-variant-numeric:tabular-nums}
.count{color:#7894af;font-size:14px;font-weight:500}
@media(max-width:760px){
 .app{padding:18px 12px 35px}.brand{font-size:37px}.subtitle{letter-spacing:3px}
 .icon-btn{width:48px;height:48px;font-size:23px}.fields,.actions{grid-template-columns:1fr;gap:16px}
 .controls{padding:20px}.field{min-width:0}.field label{font-size:19px}.field input,.field select{min-width:0;max-width:100%}.date-wrap{max-width:100%}.timer-display{font-size:54px}
 .action.action{height:66px;font-size:23px}.section{padding:20px 16px}
 .history-head{display:none}.history-row{grid-template-columns:1fr auto;gap:6px}
 .history-date{text-align:right}.history-duration{grid-column:1/-1;text-align:left;color:#4eb4ff}
 .total-card{grid-template-columns:1fr;padding:20px 16px}.total-value{text-align:left;font-size:35px}
 .worker-grid{grid-template-columns:1fr 1fr}.worker-total:last-child{grid-column:1/-1}
}

.cancel{
  display:block;margin:13px auto 0;border:1px solid #70434a;background:#2b2026;
  color:#f0b8bd;border-radius:12px;padding:9px 18px;cursor:pointer;
}
.cancel:disabled{opacity:.35;cursor:not-allowed}
.report-wrap{text-align:center;margin-top:14px}
.report-btn{
  border:1px solid #315b83;background:#10283f;color:#a9c8e7;
  border-radius:12px;padding:10px 16px;cursor:pointer;font-size:15px
}
.modal-backdrop{
  display:none;position:fixed;inset:0;background:#0009;z-index:1000;
  align-items:center;justify-content:center;padding:20px
}
.modal-backdrop.show{display:flex}
.modal{
  width:min(520px,100%);background:#0c2035;border:1px solid #244d72;
  border-radius:22px;padding:25px;box-shadow:0 25px 70px #0008
}
.modal h3{margin:0 0 18px;font-size:24px}
.modal label{display:block;color:#9eb8d1;margin:13px 0 7px}
.modal select,.modal textarea{
  width:100%;border:1px solid #315b83;background:#091b2d;color:#e6f0fb;
  border-radius:12px;padding:12px;outline:none
}
.modal textarea{min-height:95px;resize:vertical}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.modal-actions button{border:0;border-radius:11px;padding:11px 16px;cursor:pointer}
.modal-cancel{background:#20384e;color:#c7d9e9}
.modal-send{background:#1598ff;color:white}


.error-record-info{
  margin:8px 0 14px;
  padding:10px 12px;
  border-radius:10px;
  background:rgba(255,255,255,.05);
  font-size:13px;
  opacity:.9;
}

</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#071522">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EugestaTimer">
<link rel="apple-touch-icon" href="icons/icon-180.png">

</head>
<body>
<div class="app">
  <header class="top">
    <button class="icon-btn menu" aria-label="Меню" id="menuBtn">☰</button>
    <div class="menu-panel" id="menuPanel">
      <div class="menu-title" data-i18n="language">Язык</div>
      <div class="lang-row">
        <button class="lang-btn" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="et">EE</button>
      </div>
    </div>
    <button class="icon-btn theme" aria-label="Тема" id="themeBtn">☼</button>
    <img src="eugesta-logo.png" alt="Eugesta" class="logo">
    <div class="brand">Eugesta<span>Timer</span></div>
    <div class="subtitle" data-i18n="subtitle">УЧЁТ ВРЕМЕНИ СБОРКИ</div>
  </header>

  <section class="card controls">
    <div class="timer-display" id="display">00:00:00</div>
    <div class="fields">
      <div class="field">
        <label data-i18n="workerLabel">Работник</label>
        <select id="worker">
          <option value="" data-i18n="chooseWorker">Выберите работника</option>
          <option value="Viktor Jakovlev">Viktor Jakovlev</option>
          <option value="Aleksei Katsõlo">Aleksei Katsõlo</option>
          <option value="Pavel Veresinin">Pavel Veresinin</option>
          <option value="Ruslan Gavrilov">Ruslan Gavrilov</option>
          <option value="Yevhen Ostapenko">Yevhen Ostapenko</option>
        </select>
      </div>
      <div class="field">
        <label data-i18n="storeLabel">Магазин</label>
        <select id="store">
          <option value="" data-i18n="chooseStore">Выберите магазин</option>
          <option value="Maxima">Maxima</option>
          <option value="Coop">Coop</option>
          <option value="OG">OG</option>
          <option value="NGL">NGL</option>
          <option value="Muu">Muu</option>
        </select>
      </div>
      <div class="field">
        <label data-i18n="dateLabel">Дата</label>
        <div class="date-wrap"><input id="date" type="date"><span>▣</span></div>
      </div>
      <div class="field">
        <label data-i18n="currentTime">Текущее время</label>
        <div class="time-box" id="clock">00:00:00</div>
      </div>
    </div>

    <div class="actions">
      <button id="start" class="action start"><span data-i18n="start">Начать</span></button>
      <button id="finish" class="action finish" disabled><span data-i18n="finish">Закончить</span></button>
    </div>
    <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap">
      
      <button id="cancelTimer" class="cancel" disabled>↩ <span data-i18n="cancel">Отменить</span></button>
    </div>

    <div id="reportWrap" class="report-wrap">
      <button class="report-btn" id="reportBtn" type="button">⚠️ <span data-i18n="reportError">Ошибка в записи?</span></button>
    </div>

    <div class="status-line"><span id="statusDot" class="live-dot"></span><span id="status" data-i18n="stopped">Таймер остановлен</span></div>
    <div id="sync" class="sync"></div>
    <div class="info" data-i18n="info">ⓘ &nbsp;Выберите работника и магазин, затем нажмите «Начать»</div>
  </section>

  <section class="card section">
    <div class="section-head">
      <h2 class="section-title">☷ &nbsp;<span data-i18n="recent">Последние записи</span> <span class="count">(<span id="recordsCount">0</span>)</span></h2>
      <a class="open-sheet" href="https://docs.google.com/spreadsheets/d/1nWGgzcg8KZFzflutG43A1S2-4cl9N-6VJ930zt9R1-c/edit?gid=12337385" target="_blank"><span data-i18n="openSheet">Открыть таблицу</span> ↗</a>
    </div>
    <div class="history-head"><div data-i18n="workerStore">Работник / Магазин</div><div style="text-align:center" data-i18n="dateTime">Дата и время</div><div style="text-align:right" data-i18n="duration">Время</div></div>
    <div id="history"></div>
  </section>

  <section class="card total-card">
    <div class="total-main"><div class="total-icon">▮▮▮</div><div class="total-label" data-i18n="totalToday">Общее время сегодня</div></div>
    <div class="total-value" id="today">00:00:00</div>
    <div class="worker-grid" id="workerTotals" style="grid-column:1/-1"></div>
  </section>

  <div id="reportModal" class="modal-backdrop">
    <div class="modal">
      <h3 data-i18n="reportTitle">Сообщить об ошибке</h3>

      <label for="errorWorker" data-i18n="workerLabel">Работник</label>
      <select id="errorWorker"><option value="" data-i18n="chooseLanguageWorker">Выбрать работника</option></select>

      <label for="errorDate" data-i18n="recordDate">Дата записи</label>
      <select id="errorDate"><option value="">Сначала выберите работника</option></select>

      <label for="errorRecord" data-i18n="recordTime">Запись (время)</label>
      <select id="errorRecord"><option value="">Сначала выберите дату</option></select>

      <div id="errorRecordInfo" class="error-record-info">Выберите запись</div>

      <label for="reportReason" data-i18n="whatWrong">Что не так?</label>
      <select id="reportReason">
        <option value="Неправильное время" data-i18n="wrongTime">Неправильное время</option>
        <option value="Неправильный работник" data-i18n="wrongWorker">Неправильный работник</option>
        <option value="Неправильный магазин" data-i18n="wrongStore">Неправильный магазин</option>
        <option value="Другая ошибка" data-i18n="otherError">Другая ошибка</option>
      </select>

      <label for="reportComment" data-i18n="comment">Комментарий</label>
      <textarea id="reportComment" data-i18n-placeholder="commentPlaceholder" placeholder="Опишите, что произошло..."></textarea>

      <div class="modal-actions">
        <button id="reportClose" class="modal-cancel" data-i18n="close">Отмена</button>
        <button id="reportSend" class="modal-send" data-i18n="send">Отправить</button>
      </div>
      <div id="reportStatus" class="sync"></div>
    </div>
  </div>

<script>

const KEY="extra_work_records_v4";
const SCRIPT_URL="https://script.google.com/macros/s/AKfycby4ZLz0pCC7tHbjVMRpNfRo2LQIYt7iMuEjExnDq8zaDNBB_UZb22KMO74MGI5LMV1W/exec";
const workerNames=[
  "Viktor Jakovlev",
  "Aleksei Katsõlo",
  "Pavel Veresinin",
  "Ruslan Gavrilov",
  "Yevhen Ostapenko"
];
let records=JSON.parse(localStorage.getItem(KEY)||"[]"),running=false,startedAt=null,elapsed=0,interval=null,lastFinishedRecord=null;

const $=id=>document.getElementById(id);
function pad(n){return String(n).padStart(2,"0")}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return `${pad(Math.floor(sec/3600))}:${pad(Math.floor(sec%3600/60))}:${pad(sec%60)}`}
function short(sec){sec=Math.round(sec);let h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h?`${h}ч ${m}м`:`${m}м`}
function save(){localStorage.setItem(KEY,JSON.stringify(records))}
function currentSeconds(){return elapsed+(running?Date.now()/1000-startedAt:0)}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
const translations={
  ru:{language:"Язык",subtitle:"УЧЁТ ВРЕМЕНИ СБОРКИ",workerLabel:"Работник",chooseWorker:"Выберите работника",storeLabel:"Магазин",chooseStore:"Выберите магазин",dateLabel:"Дата",currentTime:"Текущее время",start:"Начать",finish:"Закончить",cancel:"Отменить",reportError:"Ошибка в записи?",stopped:"Таймер остановлен",info:"ⓘ &nbsp;Выберите работника и магазин, затем нажмите «Начать»",recent:"Последние записи",openSheet:"Открыть таблицу",workerStore:"Работник / Магазин",dateTime:"Дата и время",duration:"Время",totalToday:"Общее время сегодня",reportTitle:"Сообщить об ошибке",recordDate:"Дата записи",recordTime:"Запись (время)",whatWrong:"Что не так?",wrongTime:"Неправильное время",wrongWorker:"Неправильный работник",wrongStore:"Неправильный магазин",otherError:"Другая ошибка",comment:"Комментарий",commentPlaceholder:"Опишите, что произошло...",close:"Отмена",send:"Отправить",noRecords:"Пока нет записей",chooseLanguageWorker:"Выбрать работника",chooseLanguageDate:"Сначала выберите работника",chooseLanguageRecord:"Сначала выберите дату",loading:"Загрузка…",loadingRecords:"Загружаем записи из таблицы…",noWorkerRecords:"У этого работника пока нет записей в таблице.",noDateRecords:"Нет записей за выбранную дату.",selectRecord:"Выберите запись",running:"EugestaTimer запущен",paused:"EugestaTimer остановлен",cancelled:"Таймер отменён — запись не сохранена."},
  en:{language:"Language",subtitle:"ASSEMBLY TIME TRACKING",workerLabel:"Worker",chooseWorker:"Select worker",storeLabel:"Store",chooseStore:"Select store",dateLabel:"Date",currentTime:"Current time",start:"Start",finish:"Finish",cancel:"Cancel",reportError:"Report an error?",stopped:"Timer stopped",info:"ⓘ &nbsp;Select a worker and store, then press “Start”",recent:"Recent records",openSheet:"Open spreadsheet",workerStore:"Worker / Store",dateTime:"Date & time",duration:"Time",totalToday:"Total time today",reportTitle:"Report an error",recordDate:"Record date",recordTime:"Record (time)",whatWrong:"What is wrong?",wrongTime:"Incorrect time",wrongWorker:"Incorrect worker",wrongStore:"Incorrect store",otherError:"Other error",comment:"Comment",commentPlaceholder:"Describe what happened...",close:"Cancel",send:"Send",noRecords:"No records yet",chooseLanguageWorker:"Select worker",chooseLanguageDate:"Select a worker first",chooseLanguageRecord:"Select a date first",loading:"Loading…",loadingRecords:"Loading records from the spreadsheet…",noWorkerRecords:"This worker has no records in the spreadsheet yet.",noDateRecords:"No records for the selected date.",selectRecord:"Select a record",running:"EugestaTimer running",paused:"EugestaTimer stopped",cancelled:"Timer cancelled — record was not saved."},
  et:{language:"Keel",subtitle:"KOMPLEKTEERIMISE AJA ARVESTUS",workerLabel:"Töötaja",chooseWorker:"Vali töötaja",storeLabel:"Kauplus",chooseStore:"Vali kauplus",dateLabel:"Kuupäev",currentTime:"Praegune aeg",start:"Alusta",finish:"Lõpeta",cancel:"Tühista",reportError:"Teata veast?",stopped:"Taimer on peatatud",info:"ⓘ &nbsp;Vali töötaja ja kauplus ning vajuta „Alusta“",recent:"Viimased kirjed",openSheet:"Ava tabel",workerStore:"Töötaja / Kauplus",dateTime:"Kuupäev ja aeg",duration:"Aeg",totalToday:"Tänane koguaeg",reportTitle:"Teata veast",recordDate:"Kirje kuupäev",recordTime:"Kirje (aeg)",whatWrong:"Mis on valesti?",wrongTime:"Vale aeg",wrongWorker:"Vale töötaja",wrongStore:"Vale kauplus",otherError:"Muu viga",comment:"Kommentaar",commentPlaceholder:"Kirjelda, mis juhtus...",close:"Tühista",send:"Saada",noRecords:"Kirjeid veel pole",chooseLanguageWorker:"Vali töötaja",chooseLanguageDate:"Vali esmalt töötaja",chooseLanguageRecord:"Vali esmalt kuupäev",loading:"Laadimine…",loadingRecords:"Kirjete laadimine tabelist…",noWorkerRecords:"Sellel töötajal pole tabelis veel kirjeid.",noDateRecords:"Valitud kuupäeval kirjeid pole.",selectRecord:"Vali kirje",running:"EugestaTimer töötab",paused:"EugestaTimer on peatatud",cancelled:"Taimer tühistati — kirjet ei salvestatud."}
};
let lang=localStorage.getItem("eugesta_lang")||"ru";
function t(key){return (translations[lang]&&translations[lang][key])||translations.ru[key]||key}
function applyLanguage(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.innerHTML=t(el.dataset.i18n)});
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>el.placeholder=t(el.dataset.i18nPlaceholder));
  document.querySelectorAll(".lang-btn").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
  render();
}

function render(){
  $("display").textContent=fmt(currentSeconds());
  $("status").textContent=running?t("running"):(elapsed?t("paused"):t("stopped"));
  $("statusDot").className=running?"live-dot on":"live-dot";
  // Keep controls in sync with the actual timer state.
  $("start").disabled = running;
  $("finish").disabled = !(running || elapsed > 0);
  $("cancelTimer").disabled = !(running || elapsed > 0);

  const now=new Date();
  let tot=[0,0,0];
  const workerTotals={};
  records.forEach(r=>{
    const d=new Date(r.start),s=Number(r.duration)||0;
    if(d.toDateString()===now.toDateString())tot[0]+=s;
    if(d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth())tot[1]+=s;
    tot[2]+=s;
    workerTotals[r.worker]=(workerTotals[r.worker]||0)+s;
  });

  $("today").textContent=fmt(tot[0]);

  const workers=[
    "Viktor Jakovlev","Aleksei Katsõlo","Pavel Veresinin",
    "Ruslan Gavrilov","Yevhen Ostapenko"
  ];
  $("workerTotals").innerHTML=workers.map(w=>
    `<div class="worker-total"><span>${esc(w)}</span><strong>${fmt(workerTotals[w]||0)}</strong></div>`
  ).join("");

  $("history").innerHTML=records.length ? records.slice().reverse().slice(0,12).map(r=>{
    const d=new Date(r.start), e=new Date(r.end);
    return `<div class="history-row">
      <div class="history-main">
        <div class="history-title">${esc(r.worker||"Без работника")}</div>
        <div class="history-sub">${esc(r.store||"Без магазина")}</div>
      </div>
      <div class="history-date">${d.toLocaleDateString("ru-RU")}<br>
        ${d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}–${e.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
      </div>
      <div class="history-duration">${fmt(r.duration)}</div>
    </div>`;
  }).join(""):`<div class="empty">${t("noRecords")}</div>`;

  $("recordsCount").textContent=records.length;
}

function sendToGoogle(r){
 return new Promise(resolve=>{
   const callback="googleTimerCallback_"+Date.now()+"_"+Math.floor(Math.random()*10000);
   let done=false;
   window[callback]=(result)=>{
     done=true;delete window[callback];script.remove();
     if(result&&result.ok){$("sync").className="ok";$("sync").textContent=`✓ ${result.message}: ${result.sheet}, строка ${result.row}`;resolve(true)}
     else{$("sync").className="err";$("sync").textContent="❌ Google: "+((result&&result.message)||"Неизвестная ошибка");resolve(false)}
   };
   const startLocal = new Date(r.start);
   const endLocal = new Date(r.end);
   const localDate = [
     startLocal.getFullYear(),
     pad(startLocal.getMonth()+1),
     pad(startLocal.getDate())
   ].join("-");
   const localStart = [
     localDate, " ",
     pad(startLocal.getHours()), ":",
     pad(startLocal.getMinutes()), ":",
     pad(startLocal.getSeconds())
   ].join("");
   const localEnd = [
     localDate, " ",
     pad(endLocal.getHours()), ":",
     pad(endLocal.getMinutes()), ":",
     pad(endLocal.getSeconds())
   ].join("");
   const params=new URLSearchParams({
     action:"add",
     callback,
     date:localDate,
     start:localStart,
     end:localEnd,
     store:r.store,
     worker:r.worker
   });
   const script=document.createElement("script");script.src=SCRIPT_URL+"?"+params.toString();
   script.onerror=()=>{if(done)return;done=true;delete window[callback];script.remove();$("sync").className="err";$("sync").textContent="❌ Не удалось связаться с Google Apps Script. Проверь развёртывание.";resolve(false)};
   document.body.appendChild(script);
   setTimeout(()=>{if(done)return;done=true;delete window[callback];script.remove();$("sync").className="err";$("sync").textContent="❌ Google не ответил вовремя. Проверь развёртывание.";resolve(false)},15000);
 });
}
$("start").onclick=()=>{if(!running){
  startedAt=Date.now()/1000;
  running=true;
  interval=setInterval(render,250);
  render();
}};

$("cancelTimer").onclick=()=>{
  if(!(running || elapsed>0)) return;
  running=false;
  clearInterval(interval);
  startedAt=null;
  elapsed=0;
  $("sync").className="";
  $("sync").textContent=t("cancelled");
  render();
};


let errorRecords = [];

function escapeReportText(v) {
  return String(v ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}

function loadErrorRecords() {
  const worker = $("errorWorker").value;

  if(!worker){
    $("errorDate").innerHTML = `<option value="">${t("chooseLanguageDate")}</option>`;
    $("errorRecord").innerHTML = `<option value="">${t("chooseLanguageRecord")}</option>`;
    $("errorRecordInfo").textContent = "Сначала выберите работника";
    return;
  }

  $("errorDate").innerHTML = `<option value="">${t("loading")}</option>`;
  $("errorRecord").innerHTML = `<option value="">${t("loading")}</option>`;
  $("errorRecordInfo").textContent = t("loadingRecords");

  const callback = "errorListCallback_"+Date.now()+"_"+Math.floor(Math.random()*10000);
  let done = false;
  const script = document.createElement("script");

  window[callback] = (result) => {
    if(done)return;
    done=true;
    delete window[callback];
    script.remove();

    if(!result || !result.ok){
      $("errorDate").innerHTML = '<option value="">Ошибка</option>';
      $("errorRecord").innerHTML = '<option value="">Ошибка</option>';
      $("errorRecordInfo").textContent = "❌ "+((result&&result.message)||"Не удалось загрузить записи");
      return;
    }

    errorRecords = Array.isArray(result.records) ? result.records : [];
    const dates = [...new Set(errorRecords.map(r=>r.date).filter(Boolean))];

    if(!dates.length){
      $("errorDate").innerHTML = '<option value="">Нет записей</option>';
      $("errorRecord").innerHTML = '<option value="">Нет записей</option>';
      $("errorRecordInfo").textContent = t("noWorkerRecords");
      return;
    }

    $("errorDate").innerHTML = dates.map(d =>
      `<option value="${escapeReportText(d)}">${escapeReportText(d)}</option>`
    ).join("");

    renderErrorRecordsForDate();
  };

  script.src = SCRIPT_URL+"?action=listRecords"
    +"&worker="+encodeURIComponent(worker)
    +"&callback="+callback
    +"&_="+Date.now();

  script.onerror = () => {
    if(done)return;
    done=true;
    delete window[callback];
    script.remove();
    $("errorRecordInfo").textContent = "❌ Не удалось связаться с Google Таблицей.";
  };

  document.body.appendChild(script);
}

function renderErrorRecordsForDate() {
  const date = $("errorDate").value;
  const list = errorRecords.filter(r => r.date === date);

  if(!list.length){
    $("errorRecord").innerHTML = '<option value="">Нет записей</option>';
    $("errorRecordInfo").textContent = t("noDateRecords");
    return;
  }

  $("errorRecord").innerHTML = list.map(r => {
    const value = `${r.sheet}|${r.row}`;
    const text = `${r.start || "—"} – ${r.end || "—"}${r.store ? " · "+r.store : ""}`;
    return `<option value="${escapeReportText(value)}">${escapeReportText(text)}</option>`;
  }).join("");

  updateErrorRecordInfo();
}

function updateErrorRecordInfo() {
  const value = $("errorRecord").value;
  const found = errorRecords.find(r => `${r.sheet}|${r.row}` === value);

  $("errorRecordInfo").textContent = found
    ? `Магазин: ${found.store || "—"} · Время сборки: ${found.assembly || "—"}`
    : t("selectRecord");
}

function showReport() {
  const currentWorker = $("worker").value || "";
  $("errorWorker").innerHTML =
    `<option value="" selected>${t("chooseLanguageWorker")}</option>` +
    workerNames.map(w =>
      `<option value="${escapeReportText(w)}">${escapeReportText(w)}</option>`
    ).join("");

  // Не выбираем работника автоматически: сначала пользователь выбирает его сам.

  $("reportReason").value = "Неправильное время";
  $("reportComment").value = "";
  $("reportStatus").textContent = "";

  $("errorWorker").onchange = loadErrorRecords;
  $("errorDate").onchange = renderErrorRecordsForDate;
  $("errorRecord").onchange = updateErrorRecordInfo;

  $("reportModal").classList.add("show");
  loadErrorRecords();
}

$("reportBtn").onclick = function(e){
  e.preventDefault();
  e.stopPropagation();
  showReport();
};
$("reportClose").onclick = () => $("reportModal").classList.remove("show");

function sendErrorReport(){
  const worker = $("errorWorker").value;
  const date = $("errorDate").value;
  const recordValue = $("errorRecord").value;
  const reason = $("reportReason").value;
  const comment = $("reportComment").value.trim();

  if(!worker || !date || !recordValue || !reason){
    $("reportStatus").className="err";
    $("reportStatus").textContent="❌ Выберите работника, дату, запись и причину.";
    return;
  }

  const parts = recordValue.split("|");
  if(parts.length < 2){
    $("reportStatus").className="err";
    $("reportStatus").textContent="❌ Не удалось определить запись.";
    return;
  }

  const button = $("reportSend");
  button.disabled = true;
  $("reportStatus").className="";
  $("reportStatus").textContent="Отправляю сообщение…";

  const callback="errorReportCallback_"+Date.now()+"_"+Math.floor(Math.random()*10000);
  let done=false;
  const script=document.createElement("script");

  window[callback]=(result)=>{
    if(done)return;
    done=true;
    delete window[callback];
    script.remove();
    button.disabled=false;

    if(result&&result.ok){
      $("reportStatus").className="ok";
      $("reportStatus").textContent="✓ Сообщение отправлено администратору";
    }else{
      $("reportStatus").className="err";
      $("reportStatus").textContent="❌ Google: "+((result&&result.message)||"Ошибка");
    }
  };

  script.src=SCRIPT_URL+"?action=reportError"
    +"&sheet="+encodeURIComponent(parts[0])
    +"&row="+encodeURIComponent(parts[1])
    +"&worker="+encodeURIComponent(worker)
    +"&reason="+encodeURIComponent(reason)
    +"&comment="+encodeURIComponent(comment)
    +"&callback="+callback
    +"&_="+Date.now();

  script.onerror=()=>{
    if(done)return;
    done=true;
    delete window[callback];
    script.remove();
    button.disabled=false;
    $("reportStatus").className="err";
    $("reportStatus").textContent="❌ Не удалось отправить сообщение.";
  };

  document.body.appendChild(script);
}

$("reportSend").onclick = sendErrorReport;

$("finish").onclick=async()=>{
 let worker=$("worker").value;
 let store=$("store").value.trim();
 if(!worker){$("sync").className="err";$("sync").textContent="❌ Сначала выбери работника.";return}
 if(!store){$("sync").className="err";$("sync").textContent="❌ Сначала укажи магазин.";return}
 let duration=Math.round(currentSeconds());if(duration<1)return;
 let end=new Date(),start=new Date(end.getTime()-duration*1000);
 let r={start:start.toISOString(),end:end.toISOString(),duration,store,worker};
 records.push(r);save();running=false;clearInterval(interval);startedAt=null;elapsed=0;
 $("sync").className="";$("sync").textContent="Отправляю запись в Google…";
 lastFinishedRecord=r;
 $("reportWrap").style.display="block";
 render();
 await sendToGoogle(r);
};
